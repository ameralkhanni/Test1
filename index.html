<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>أحمد علي محمد | البطاقة الرقمية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<main class="card">

  <!-- Header -->
  <header class="card__header">
    <div class="card__logo">
      <img src="assets/logo.webp" alt="شعار الجهة" class="card__logo-icon">
     
    </div>
  </header>

  <!-- Identity -->
  <section class="card__identity">
    <div class="card__avatar">
      <img src="assets/avatar.avif" alt="الصورة الشخصية">
    </div>
    <div class="card__names">
      <p class="card__title">المهندس</p>
      <h1 class="card__name">أحمد علي محمد</h1>
      <p class="card__dept">مدير إدارة التحول الرقمي</p>
    </div>
  </section>

  <!-- Contact info -->
  <section class="card__contact">
    <a class="contact-row" href="tel:+966500000000">
      <span class="contact-row__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M6.62 10.79a15.05 15.05 0 0 0 6.59 6.59l2.2-2.2a1 1 0 0 1 1.02-.24c1.12.37 2.33.57 3.57.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1C10.61 21 3 13.39 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.24.2 2.45.57 3.57a1 1 0 0 1-.25 1.02l-2.2 2.2z"/></svg>
      </span>
      <span class="contact-row__text">
        <span class="contact-row__label">رقم الجوال</span>
        <span class="contact-row__value" dir="ltr">+966 50 000 0000</span>
      </span>
    </a>
    <a class="contact-row" href="mailto:ahmed.ali@example.gov.sa">
      <span class="contact-row__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm16 4.24-7.55 5.05a1 1 0 0 1-1.1 0L4 8.24V18h16zM4.5 6l7.5 5 7.5-5z"/></svg>
      </span>
      <span class="contact-row__text">
        <span class="contact-row__label">البريد الإلكتروني</span>
        <span class="contact-row__value" dir="ltr">ahmed.ali@example.gov.sa</span>
      </span>
    </a>
  </section>

  <!-- Actions -->
  <section class="card__actions">
    <button id="saveContactBtn" class="btn-primary" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0 2c-4.42 0-8 2.24-8 5v1a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-1c0-2.76-3.58-5-8-5z"/><path d="M19 11h2v2h-2v2h-2v-2h-2v-2h2V9h2z"/></svg>
      <span>إضافة إلى جهات الاتصال</span>
    </button>
  </section>

  <footer class="card__footer">
    <img src="assets/logo.webp" alt="" class="card__footer-icon">
    <span>الهيئة العامة للمساحة والمعلومات الجيومكانية</span>
  </footer>

</main>

<script src="script.js"></script>
</body>
</html>
